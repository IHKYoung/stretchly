<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pauza 是一款更安静的久坐提醒。官网以极简打字机方式展示应用内置的有趣提醒文案，并保留一个简洁下载入口。"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Pauza | 更安静的久坐提醒</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/LXGWWenKaiScreen.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a
      class="download-button"
      href="https://github.com/IHKYoung/Pauza/releases/download/v0.1.3/Pauza_0.1.3_aarch64.dmg"
      aria-label="下载 Pauza"
      data-download-button
    >
      <span>下载</span>
    </a>

    <div class="interaction-layer" data-interaction-layer aria-hidden="true"></div>

    <main class="page-shell">
      <section
        class="typewriter-stage"
        aria-labelledby="typewriter-title"
        aria-describedby="interaction-hint"
        data-typewriter-stage
        tabindex="0"
      >
        <p class="prompt-line" aria-hidden="true">
          <span class="prompt-mark">Pauza&gt;</span>
        </p>

        <div class="terminal-output">
          <h1 id="typewriter-title" class="typewriter-copy">
            <span class="sr-only">Pauza 会循环展示应用内置的提醒文案。</span>
            <span class="typed-output" data-typed-output aria-hidden="true"></span>
            <span class="caret" aria-hidden="true"></span>
          </h1>

          <p id="interaction-hint" class="interaction-hint">
            点一下，收一条不太客气的休息提醒。
          </p>
        </div>
      </section>
    </main>

    <script src="./copy.js"></script>
    <script src="./download/targets.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
