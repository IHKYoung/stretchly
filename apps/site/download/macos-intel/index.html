<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pauza | Download for Intel</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-target="macosIntel">
    <main class="redirect-shell">
      <a class="redirect-brand" href="../../">Pauza</a>

      <section class="redirect-card">
        <div class="route-badge" data-route-label>/download/macos-intel/</div>

        <div class="redirect-hero">
          <div class="redirect-spinner" aria-hidden="true"></div>
          <div class="redirect-copy">
            <h1 data-title>正在准备下载</h1>
            <p data-subtitle>正在校验 Intel 下载地址。</p>
          </div>
        </div>

        <div class="countdown-row">
          <span>Auto redirect</span>
          <span class="countdown-value" data-countdown>2</span>
        </div>

        <div class="redirect-actions">
          <a class="redirect-button primary" data-manual-link href="#" hidden>立即打开下载链接</a>
          <a class="redirect-button secondary" data-fallback-link href="../../">返回首页</a>
        </div>

        <p class="redirect-note" data-note></p>
      </section>
    </main>

    <script src="../targets.js"></script>
    <script src="../redirect.js"></script>
  </body>
</html>
